<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网站B - 查询账号信息</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 40px;
      width: 100%;
      max-width: 500px;
    }
    h1 {
      color: #333;
      margin-bottom: 8px;
      font-size: 24px;
    }
    .subtitle {
      color: #888;
      margin-bottom: 24px;
      font-size: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-size: 14px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e1e5e9;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 18px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #f5576c;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    #result {
      margin-top: 18px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #e1e5e9;
      min-height: 60px;
      white-space: pre-wrap;
      font-size: 14px;
      color: #333;
      display: none;
    }
    #result.show {
      display: block;
    }
    .nav-link {
      display: inline-block;
      margin-top: 24px;
      color: #f5576c;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
    .divider {
      border: none;
      border-top: 1px solid #e1e5e9;
      margin: 20px 0;
    }
    .info-label {
      font-weight: 600;
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>查询账号信息</h1>
    <p class="subtitle">输入账号名，查询已保存的信息</p>

    <label for="username">账号名</label>
    <input id="username" type="text" placeholder="请输入要查询的账号名" />

    <button id="searchBtn">查询</button>

    <div id="result"></div>

    <hr class="divider" />

    <a href="index.html" class="nav-link">← 前往网站A - 录入信息</a>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://hkejbjmgkqxjjmgrxtuj.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrZWpiam1na3F4amptZ3J4dHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MDQ3NTEsImV4cCI6MjEwNzM4MDc1MX0.TfJCm31vKy9wEIMnbrlcLUh5_Ydzvx1Rxn7YgKSIN1U'
    );

    const resultEl = document.getElementById('result');

    document.getElementById('searchBtn').onclick = async () => {
      const username = document.getElementById('username').value.trim();

      if (!username) {
        resultEl.className = 'show';
        resultEl.textContent = '请输入账号名';
        return;
      }

      resultEl.className = 'show';
      resultEl.textContent = '正在查询...';

      const { data, error } = await supabase
        .from('user_infos')
        .select('*')
        .eq('username', username)
        .order('created_at', { ascending: false })
        .limit(1)
        .single();

      if (error || !data) {
        resultEl.className = 'show';
        resultEl.textContent = '未找到该账号的信息，请先在网站A创建账号并录入。';
      } else {
        resultEl.className = 'show';
        resultEl.innerHTML =
          '<span class="info-label">账号名：</span>' + data.username + '<br/>' +
          '<span class="info-label">录入信息：</span>' + data.info + '<br/>' +
          '<span class="info-label">创建时间：</span>' + new Date(data.created_at).toLocaleString('zh-CN');
      }
    };
  </script>
</body>
</html>
